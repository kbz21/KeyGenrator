spring:
  application:
    name: keygenerator

  datasource:
    url: jdbc:mariadb://localhost:3306/key_generator_db
    username: root
    password: 12345678
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

  sql:
    init:
      mode: never  # Disabled - using @PostConstruct instead

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    com.kibrom.keygenerator: DEBUG
    org.hibernate.SQL: DEBUG